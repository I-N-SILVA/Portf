<!--
  Static form for Netlify Forms detection. The interactive React form in
  components/studio/ContactForm.tsx submits to this via fetch. Field names
  here MUST match the React form. Do not delete.
-->
<!DOCTYPE html>
<html>
  <head>
    <title>Netlify Forms detection</title>
  </head>
  <body>
    <form name="studio-contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="company" />
      <input type="text" name="projectType" />
      <textarea name="message"></textarea>
      <input type="text" name="ref" />
      <input type="text" name="bot-field" />
    </form>
  </body>
</html>

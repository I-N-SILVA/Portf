# Netlify build & runtime configuration.
#
# This site deploys to Netlify only. The official Next.js runtime plugin
# handles SSR, middleware, image optimization and the publish directory.
#
# Two things depend on being on Netlify specifically:
#   - the studio contact form (Netlify Forms + netlify/functions/submission-created)
#   - the hourly nudge evaluation (netlify/functions/nudges-cron, scheduled)
# Moving hosts means replacing both.

[build]
  command = "npm run build"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  directory = "netlify/functions"
